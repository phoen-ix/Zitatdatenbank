# Tooling config (ruff). The app lives flat in app/ (no package), tests in tests/.
[tool.ruff]
target-version = "py315"
line-length = 120
src = ["app", "tests"]
extend-exclude = ["app/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"app/translations.py" = ["E501"]   # one DE/EN string pair per line

[tool.ruff.format]
quote-style = "single"
