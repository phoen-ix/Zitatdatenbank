name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest

      # The installed environment, not pip-audit's own dependencies: freeze first,
      # then run pip-audit through pipx (preinstalled on the runners).
      - name: Audit dependencies
        run: |
          pip freeze --exclude-editable > "$RUNNER_TEMP/requirements-frozen.txt"
          pipx run pip-audit -r "$RUNNER_TEMP/requirements-frozen.txt" --no-deps --disable-pip --progress-spinner off

  # The docs tour (scripts/docs-screenshots.sh) as a render check: every page
  # the README shows, in a real browser against a fresh stack, failing on an
  # uncaught page error or a missing element. Its PNGs are thrown away; the
  # committed ones come from docs-screenshots.yml.
  docs-tour:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Docs tour (render check)
        run: ARTIFACTS="$RUNNER_TEMP/docs-run" scripts/docs-screenshots.sh "$RUNNER_TEMP/screenshots"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: docs-run
          path: ${{ runner.temp }}/docs-run/
          retention-days: 7
